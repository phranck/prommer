<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3A42"/>
      <stop offset="0.55" stop-color="#1D1D22"/>
      <stop offset="1" stop-color="#0B0B0E"/>
    </linearGradient>

    <linearGradient id="chipFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F0EA"/>
      <stop offset="0.5" stop-color="#DCD9D1"/>
      <stop offset="1" stop-color="#BFBCB4"/>
    </linearGradient>

    <linearGradient id="leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9C7C0"/>
      <stop offset="1" stop-color="#8E8C86"/>
    </linearGradient>

    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C6B2C"/>
      <stop offset="0.55" stop-color="#1C9C42"/>
      <stop offset="1" stop-color="#43D16B"/>
    </linearGradient>

    <filter id="plateShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="chipShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <!-- Der Pfeil liegt in einer Vertiefung: oben Schatten, unten Streiflicht -->
    <filter id="engrave" x="-40%" y="-40%" width="180%" height="180%">
      <feOffset in="SourceAlpha" dx="0" dy="14" result="downShift"/>
      <feGaussianBlur in="downShift" stdDeviation="2" result="downBlur"/>
      <feComposite in="SourceAlpha" in2="downBlur" operator="out" result="topMask"/>
      <feFlood flood-color="#04240C" flood-opacity="0.96" result="topInk"/>
      <feComposite in="topInk" in2="topMask" operator="in" result="topShade"/>

      <feOffset in="SourceAlpha" dx="0" dy="-10" result="upShift"/>
      <feGaussianBlur in="upShift" stdDeviation="2" result="upBlur"/>
      <feComposite in="SourceAlpha" in2="upBlur" operator="out" result="bottomMask"/>
      <feFlood flood-color="#E4FFEC" flood-opacity="0.72" result="bottomInk"/>
      <feComposite in="bottomInk" in2="bottomMask" operator="in" result="bottomSheen"/>

      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="topShade"/>
        <feMergeNode in="bottomSheen"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Grundplatte im Format, das macOS für Programmsymbole vorgibt -->
  <g filter="url(#plateShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#plate)"/>
    <rect x="100.5" y="100.5" width="823" height="823" rx="185" ry="185"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>
  </g>

  <!-- Leiterbahnen, die auf den Baustein zulaufen -->
  <g stroke="#3DDC72" stroke-opacity="0.22" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M168 232 H256 V326"/>
    <path d="M168 792 H256 V698"/>
    <path d="M856 232 H768 V326"/>
    <path d="M856 792 H768 V698"/>
  </g>

  <!-- Anschlussbeine -->
  <g fill="url(#leg)">
    <rect x="196" y="351" width="104" height="46" rx="16"/>
    <rect x="196" y="443" width="104" height="46" rx="16"/>
    <rect x="196" y="535" width="104" height="46" rx="16"/>
    <rect x="196" y="627" width="104" height="46" rx="16"/>
    <rect x="724" y="351" width="104" height="46" rx="16"/>
    <rect x="724" y="443" width="104" height="46" rx="16"/>
    <rect x="724" y="535" width="104" height="46" rx="16"/>
    <rect x="724" y="627" width="104" height="46" rx="16"/>
  </g>

  <!-- Gehäuse des Speicherbausteins -->
  <g filter="url(#chipShadow)">
    <rect x="292" y="312" width="440" height="400" rx="36" ry="36" fill="url(#chipFace)"/>
    <rect x="292" y="312" width="440" height="400" rx="36" ry="36"
          fill="none" stroke="#6E6C66" stroke-opacity="0.45" stroke-width="4"/>
  </g>

  <!-- Kerbe und Pin-1-Punkt, wie sie auf dem echten Gehäuse sitzen -->
  <path d="M480 312 a32 32 0 0 0 64 0 z" fill="#A8A59E" fill-opacity="0.85"/>
  <circle cx="346" cy="366" r="18" fill="#8A8882"/>

  <!-- Der Pfeil ist in die Oberfläche eingelassen -->
  <g>
    <!-- Die Lichtkante der unteren Grubenlippe, auf dem Gehäuse selbst -->
    <path d="M476 378 H548 V506 H622 L512 646 L402 506 H476 Z"
          transform="translate(0 5)"
          fill="#FFFFFF" fill-opacity="0.70"/>
    <path d="M476 378 H548 V506 H622 L512 646 L402 506 H476 Z"
          fill="url(#spark)" filter="url(#engrave)" stroke-linejoin="round"/>
  </g>
</svg>
